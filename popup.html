<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #202124;
      background-color: #ffffff;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background-color: #1a73e8;
      color: #ffffff;
    }

    header img {
      width: 24px;
      height: 24px;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }

    main {
      padding: 12px 16px 16px;
    }

    label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 0;
      font-size: 13px;
      line-height: 1.4;
      cursor: pointer;
    }

    label+label {
      border-top: 1px solid #e8eaed;
    }

    input[type="checkbox"] {
      margin: 2px 0 0;
      accent-color: #1a73e8;
      cursor: pointer;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 8px 0;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1a73e8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1765cc;
    }

    button:disabled {
      background-color: #a0c3f5;
      cursor: default;
    }

    #checkResult {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      text-align: left;
    }

    #checkResult.ok {
      background-color: #e6f4ea;
      color: #137333;
    }

    #checkResult.warn {
      background-color: #fce8e6;
      color: #c5221f;
    }

    #checkResult.muted {
      background-color: #f1f3f4;
      color: #5f6368;
    }
  </style>
</head>

<body>
  <header>
    <img src="images/icon-32.png" alt="" />
    <h1 data-i18n="popupTitle"></h1>
  </header>
  <main>
    <label>
      <input type="checkbox" id="toggleNotificationsURL" />
      <span data-i18n="enableUrlNotifications"></span>
    </label>
    <label>
      <input type="checkbox" id="toggleNotificationsLINKS" />
      <span data-i18n="enableLinkNotifications"></span>
    </label>
    <button id="checkNow" data-i18n="checkNow"></button>
    <div id="checkResult" hidden></div>
  </main>
  <script type="module" src="popup.js"></script>
</body>

</html>
