name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high
      # v1.4.0 and its rehearsal tags (v1.4.0-rc.1) need manifest version 1.4.0.
      - name: Tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          echo "tag: $tag_version, manifest: $manifest_version"
          test "${tag_version%%-*}" = "$manifest_version"
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: extension-package
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-package
      # Tags with a suffix (v1.4.0-rc.1) are rehearsals: published as
      # pre-releases so they can be checked and deleted without affecting the
      # latest release.
      - name: Create GitHub release with the store package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" *.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Upload the attached ZIP to the Chrome Web Store." \
            $prerelease
