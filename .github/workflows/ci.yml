name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA (a tag can be moved); Dependabot keeps both
# the SHA and the version comment up to date.
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Chrome for Testing is only needed by the e2e job.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high
      # v1.4.0 and its rehearsal tags (v1.4.0-rc.1) need manifest version 1.4.0
      # and a 1.4.0 section in the changelog.
      - name: Tag matches manifest version and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          echo "tag: $tag_version, manifest: $manifest_version"
          test "${tag_version%%-*}" = "$manifest_version"
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-package
          path: dist/*.zip
          if-no-files-found: error

  # Loads the extension in Chrome for Testing against the manual test page.
  # Not a required check: a Chrome change can break it without a bug in the
  # extension, so it reports without blocking the merge or the release.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Explicit, in case npm stops running Puppeteer's install script.
      - run: npx puppeteer browsers install chrome
      - run: npm run test:e2e

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestation of the ZIP (gh attestation verify).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-package
          path: package
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: package/*.zip
      # Tags with a suffix (v1.4.0-rc.1) are rehearsals: published as
      # pre-releases so they can be checked and deleted without affecting the
      # latest release.
      - name: Create GitHub release with the store package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          {
            node scripts/release-notes.mjs "$GITHUB_REF_NAME"
            echo
            echo "Upload the attached ZIP to the Chrome Web Store."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" package/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $prerelease
