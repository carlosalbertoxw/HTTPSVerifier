name: Dependabot auto-merge

# Turns on auto-merge (squash) for Dependabot PRs that only bring patch or
# minor updates. GitHub merges them once the required checks of the "Checks en
# PR" ruleset pass; a failing check leaves the PR open. Major updates are left
# for manual review.
#
# Runs on pull_request (not pull_request_target): a PR from a fork never gets
# a token that can write, and the job only runs for PRs opened by Dependabot.
on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # For a grouped PR, update-type is the highest change in the group.
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
