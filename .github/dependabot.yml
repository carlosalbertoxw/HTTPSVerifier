version: 2
# Updates are proposed only once a version has been public for 7 days:
# malicious releases of npm packages are usually found and pulled within that
# time.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # One PR for all actions: the CodeQL init and analyze steps fail if they
    # are on different versions.
    groups:
      github-actions:
        patterns: ["*"]
